<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Sea Route Vessel Activity</title>
  <script src="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      background: hsl(0, 0%, 2%);
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-width: 250px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <strong>Vessel Activity</strong>
  <div id="stats" style="margin-top: 10px; color: #666;">Loading...</div>
</div>

<script>
  // Register PMTiles protocol
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // Initialize map with globe projection
  const map = new maplibregl.Map({
    container: 'map',
    projection: 'globe',
    style: {
      version: 8,
      sources: {
        'vessel-heatmap': {
          type: 'raster',
          tiles: ['http://localhost:8000/tiles/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: 'GFW 4Wings'
        },
        'protected-areas': {
          type: 'vector',
          url: 'pmtiles://./data/protected_areas.pmtiles',
          attribution: 'Russian Ministry'
        }
      },
      layers: [
        {
          id: 'background',
          type: 'background',
          paint: {
            'background-color': 'hsl(0, 0%, 5%)'
          }
        },
        {
          id: 'vessel-heatmap',
          type: 'raster',
          source: 'vessel-heatmap',
          paint: {
            'raster-opacity': 0.8
          }
        },
        {
          id: 'protected-areas',
          type: 'fill',
          source: 'protected-areas',
          'source-layer': 'protected_areas',
          paint: {
            'fill-color': '#808080',
            'fill-opacity': 0.2
          }
        },
        {
          id: 'protected-areas-outline',
          type: 'line',
          source: 'protected-areas',
          'source-layer': 'protected_areas',
          paint: {
            'line-color': '#606060',
            'line-width': 1,
            'line-opacity': 0.5
          }
        }
      ]
    },
    center: [100, 73],
    zoom: 2.5,
    pitch: 30,
    bearing: 0,
    maxZoom: 10,
    minZoom: 0
  });

  map.on('load', () => {
    document.getElementById('stats').textContent =
      'Vessel activity heatmap (2024)\nDarker = more activity';
  });
</script>
</body>
</html>

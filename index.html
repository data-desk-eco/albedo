<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Sea Route Vessel Activity</title>
  <script src="https://unpkg.com/maplibre-gl@5.0.0-pre.3/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.0.0-pre.3/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-width: 250px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <strong>Vessel Activity</strong>
  <div id="stats" style="margin-top: 10px; color: #666;">Loading...</div>
</div>

<script>
  // Register PMTiles protocol
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // Initialize map with globe projection
  const map = new maplibregl.Map({
    container: 'map',
    projection: 'globe',
    style: {
      version: 8,
      sources: {
        'satellite': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: 'Esri'
        },
        'vessel-activity': {
          type: 'vector',
          url: 'pmtiles://./data/tiles.pmtiles',
          attribution: 'Global Fishing Watch'
        }
      },
      layers: [
        {
          id: 'satellite',
          type: 'raster',
          source: 'satellite'
        },
        {
          id: 'vessel-heat',
          type: 'circle',
          source: 'vessel-activity',
          'source-layer': 'vessel_activity',
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              2, 2,
              10, 8
            ],
            'circle-color': [
              'interpolate', ['linear'], ['get', 'hours'],
              0, '#fee5d9',
              50, '#fcae91',
              100, '#fb6a4a',
              200, '#de2d26',
              500, '#a50f15'
            ],
            'circle-opacity': 0.7,
            'circle-blur': 0.5
          }
        }
      ]
    },
    center: [0, 90],
    zoom: 1.5,
    pitch: 0,
    bearing: 0,
    maxZoom: 10,
    minZoom: 0
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on('load', () => {
    document.getElementById('stats').textContent =
      'Pan and zoom to explore\nvessel activity (2024)';
  });

  // Show popup on click
  map.on('click', 'vessel-heat', (e) => {
    const props = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`
        <strong>Grid Cell</strong><br>
        Unique vessels: ${props.vessels}<br>
        Total hours: ${props.hours}<br>
        Detections: ${props.detections}
      `)
      .addTo(map);
  });

  map.on('mouseenter', 'vessel-heat', () => {
    map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', 'vessel-heat', () => {
    map.getCanvas().style.cursor = '';
  });
</script>
</body>
</html>

  <meta charset="utf-8">

  <title>Albedo</title>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      background: hsl(0, 0%, 2%);
    }
    #logo-container {
      position: absolute;
      bottom: 0;
      right: 0;
      mix-blend-mode: exclusion;
      margin-bottom: -5px;
      margin-right: -2px;
    }
    #logo-container > * {
      display: inline-block;
      vertical-align: bottom;
      margin-left: 8px;
    }
    .logo path, .logo polygon {
      fill: #ffffff;
    }
    #arctida-logo {
      height: 22px;
    }
    #datadesk-logo {
      height: 28px;
    }
    #logo-separator {
      color: #ffffff;
      font-size: 16px;
      line-height: 26px;
    }
    #legend {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-family: sans-serif;
      font-size: 15px;
      line-height: 1.8;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .legend-item:last-child {
      margin-bottom: 0;
    }
    .legend-symbol {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .legend-square {
      width: 18px;
      height: 18px;
    }
    .legend-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #000000;
      box-sizing: border-box;
    }
    .legend-text {
      mix-blend-mode: exclusion;
      color: #ffffff;
      text-transform: lowercase;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    .legend-source {
      mix-blend-mode: exclusion;
      color: #ffffff;
      font-style: italic;
      font-size: 12px;
      margin-top: 12px;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    #lang-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      mix-blend-mode: exclusion;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    #lang-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .maplibregl-popup {
      mix-blend-mode: exclusion;
    }
    .maplibregl-popup-content {
      background: transparent;
      border: 1px solid #ffffff;
      border-radius: 0;
      padding: 8px 10px;
      box-shadow: none;
    }
    .maplibregl-popup-tip {
      display: none;
    }
    .maplibregl-popup-close-button {
      color: #ffffff;
      font-size: 18px;
      padding: 2px 6px;
    }
  </style>
</head>

<script>
  // Internationalization
  const i18n = {
    en: {
      protectedAreas: 'protected areas',
      vesselCrossings: 'vessel crossings',
      dataSource: 'Data source: Global Fishing Watch',
      vessel: 'Vessel',
      mmsi: 'MMSI',
      type: 'Type',
      flag: 'Flag',
      duration: 'Duration',
      days: 'days',
      hours: 'hours',
      firstSeen: 'First seen',
      lastSeen: 'Last seen',
      unknown: 'Unknown',
      protectedArea: 'Protected Area'
    },
    ru: {
      protectedAreas: 'охраняемые территории',
      vesselCrossings: 'пересечения судов',
      dataSource: 'Источник данных: Global Fishing Watch',
      vessel: 'Судно',
      mmsi: 'MMSI',
      type: 'Тип',
      flag: 'Флаг',
      duration: 'Длительность',
      days: 'дней',
      hours: 'часов',
      firstSeen: 'Первое обнаружение',
      lastSeen: 'Последнее обнаружение',
      unknown: 'Неизвестно',
      protectedArea: 'Охраняемая территория'
    }
  };
  let lang = 'en';
  const t = (key) => i18n[lang][key];

  function updateUI() {
    document.getElementById('legend-protected').textContent = t('protectedAreas');
    document.getElementById('legend-crossings').textContent = t('vesselCrossings');
    document.getElementById('legend-source').textContent = t('dataSource');
  }

  document.getElementById('lang-toggle').addEventListener('click', () => {
    lang = lang === 'en' ? 'ru' : 'en';
    document.getElementById('lang-toggle').textContent = lang === 'en' ? 'RU' : 'EN';
    updateUI();
  });

  // Register PMTiles protocol
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // Arctic region focus
  const ARCTIC_CENTER_LAT = 75;

  // Create diagonal cross-hatch pattern
  function createCrosshatchPattern() {
    const size = 16;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.strokeStyle = '#cccccc';
    ctx.lineWidth = 1;

    // Draw diagonal lines (/)
    ctx.beginPath();
    ctx.moveTo(0, size);
    ctx.lineTo(size, 0);
    ctx.stroke();

    // Draw diagonal lines (\)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(size, size);
    ctx.stroke();

    return ctx.getImageData(0, 0, size, size);
  }

  // Get base path for tile URLs (works with /albedo or any path prefix)
  const basePath = window.location.pathname.endsWith('/')
    ? window.location.pathname
    : window.location.pathname + '/';

  const map = new maplibregl.Map({
    container: 'map',
    attributionControl: false,
    style: {
      version: 8,
      projection: {
        type: 'globe'
      },
      sources: {
        'land': {
          type: 'vector',
          url: 'pmtiles://' + basePath + 'data/land.pmtiles',
          attribution: '© Natural Earth'
        },
        'vessel-heatmap': {
          type: 'raster',
          tiles: [basePath + 'tiles/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: 'GFW 4Wings'
        },
        'protected-areas': {
          type: 'vector',
          url: 'pmtiles://' + basePath + 'data/protected_areas.pmtiles',
          attribution: 'Russian Ministry'
        },
        'vessel-incursions': {
          type: 'vector',
          url: 'pmtiles://' + basePath + 'data/vessel_incursions.pmtiles',
          attribution: 'GFW 4Wings'
        }
      },
      layers: [
        {
          id: 'background',
          type: 'background',
          paint: {
            'background-color': '#000000'
          }
        },
        {
          id: 'land',
          type: 'fill',
          source: 'land',
          'source-layer': 'land',
          paint: {
            'fill-color': '#e3e3e3',
            'fill-opacity': 1
          }
        },
        {
          id: 'protected-areas',
          type: 'fill',
          source: 'protected-areas',
          'source-layer': 'protected_areas',
          paint: {
            'fill-color': '#00ff00',
            'fill-opacity': 0.6
          }
        },
        {
          id: 'vessel-heatmap',
          type: 'raster',
          source: 'vessel-heatmap',
          paint: {
            'raster-opacity': 1,
            'raster-resampling': 'nearest',  // Keep pixels crisp, no blur
            'raster-brightness-max': 1,      // Boost brightness
            'raster-contrast': 0.3           // Increase contrast to make it pop
          }
        },
        {
          id: 'incursions',
          type: 'circle',
          source: 'vessel-incursions',
          'source-layer': 'incursions',
          minzoom: 0,
          maxzoom: 24,
          paint: {
            'circle-radius': [
              'interpolate',
              ['linear'],
              ['zoom'],
              2.5, [
                'interpolate',
                ['linear'],
                ['get', 'total_hours'],
                1, 4,      // 1 hour → 4px at min zoom
                24, 5,     // 1 day → 5px
                168, 6,    // 1 week → 6px
                720, 8     // 1 month → 8px
              ],
              10, [
                'interpolate',
                ['linear'],
                ['get', 'total_hours'],
                1, 8,      // 1 hour → 8px at max zoom
                24, 10,    // 1 day → 10px
                168, 12,   // 1 week → 12px
                720, 16    // 1 month → 16px
              ]
            ],
            'circle-color': '#ffffff',  // white fill
            'circle-opacity': 0.5,
            'circle-stroke-width': 2,
            'circle-stroke-color': '#000000',  // black
            'circle-stroke-opacity': 1
          }
        }
      ]
    },
    center: [100, ARCTIC_CENTER_LAT],
    zoom: 2.5,
    pitch: 20,  // Slight tilt to view Arctic region
    bearing: 0,
    maxZoom: 10,
    minZoom: 2.5,
    minPitch: 0,
    maxPitch: 30,
    renderWorldCopies: false
  });

  // Add crosshatch pattern when map loads
  map.on('load', () => {
    const imageData = createCrosshatchPattern();
    map.addImage('crosshatch', imageData, { pixelRatio: 1 });
  });

  // Keep focus on Arctic region
  map.on('moveend', () => {
    const center = map.getCenter();
    const zoom = map.getZoom();

    // More permissive threshold when zoomed in
    const threshold = zoom > 4 ? 50 : 60;

    if (center.lat < threshold) {
      map.panTo([center.lng, ARCTIC_CENTER_LAT]);
    }
  });

  // Popup for incursion points on hover
  const popup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false
  });

  map.on('mouseenter', 'incursions', (e) => {
    map.getCanvas().style.cursor = 'pointer';

    const props = e.features[0].properties;
    const hours = props.total_hours;
    const days = (hours / 24).toFixed(1);

    const html = `
      <div style="font-family: sans-serif; font-size: 15px; line-height: 1.5; color: #ffffff; text-transform: lowercase;">
        <table style="width: 100%; border-collapse: collapse;">
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('vessel')}</td><td>${props.ship_name || t('unknown')}</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('mmsi')}</td><td>${props.mmsi}</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('type')}</td><td>${props.vessel_type || t('unknown')}</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('flag')}</td><td>${props.flag || t('unknown')}</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('duration')}</td><td>${days} ${t('days')} (${hours.toFixed(1)} ${t('hours')})</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('firstSeen')}</td><td>${props.first_seen.split('T')[0]}</td></tr>
          <tr><td style="padding: 2px 12px 2px 0; text-align: right;">${t('lastSeen')}</td><td>${props.last_seen.split('T')[0]}</td></tr>
        </table>
      </div>
    `;

    popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
  });

  map.on('mouseleave', 'incursions', () => {
    map.getCanvas().style.cursor = '';
    popup.remove();
  });

</script>
</body>
</html>

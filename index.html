<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Sea Route Vessel Activity</title>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      background: hsl(0, 0%, 2%);
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-width: 250px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <strong>Vessel Activity</strong>
  <div id="stats" style="margin-top: 10px; color: #666;">Loading...</div>
</div>

<script>
  // Register PMTiles protocol
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // Initialize map
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'basemap': {
          type: 'raster',
          tiles: ['https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: 'CARTO'
        },
        'vessel-activity': {
          type: 'vector',
          url: 'pmtiles://./data/tiles.pmtiles',
          attribution: 'Global Fishing Watch'
        }
      },
      layers: [
        {
          id: 'basemap',
          type: 'raster',
          source: 'basemap'
        },
        {
          id: 'vessel-grid',
          type: 'circle',
          source: 'vessel-activity',
          'source-layer': 'vessel_activity',
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              0, 4,
              2, 5,
              4, 6,
              6, 7,
              10, 10
            ],
            'circle-color': [
              'interpolate', ['linear'], ['get', 'hours'],
              0, '#e0e0e0',
              50, '#a0a0a0',
              100, '#606060',
              200, '#303030',
              500, '#000000'
            ],
            'circle-opacity': 0.8
          },
          minzoom: 0
        }
      ]
    },
    center: [0, 90],
    zoom: 2.0,
    pitch: 0,
    bearing: 0,
    maxZoom: 10,
    minZoom: 0
  });

  map.addControl(new maplibregl.NavigationControl());

  // Set globe projection after style loads
  map.on('style.load', () => {
    map.setProjection({ type: 'globe' });
  });

  map.on('load', () => {
    document.getElementById('stats').textContent =
      'Pan and zoom to explore\nvessel activity (2024)';
  });

  // Show popup on click
  map.on('click', 'vessel-grid', (e) => {
    const props = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`
        <strong>Grid Cell</strong><br>
        Unique vessels: ${props.vessels}<br>
        Total hours: ${props.hours}<br>
        Detections: ${props.detections}
      `)
      .addTo(map);
  });

  map.on('mouseenter', 'vessel-grid', () => {
    map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', 'vessel-grid', () => {
    map.getCanvas().style.cursor = '';
  });
</script>
</body>
</html>

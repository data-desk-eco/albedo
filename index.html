<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Sea Route Vessel Activity</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-maplibre@0.3.0/dist/georaster-layer-for-maplibre.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      background: hsl(0, 0%, 2%);
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-width: 250px;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <strong>Vessel Activity</strong>
  <div id="stats" style="margin-top: 10px; color: #666;">Loading...</div>
</div>

<script>
  // Register PMTiles protocol
  let protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  // Initialize map
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'basemap': {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        },
        'protected-areas': {
          type: 'vector',
          url: 'pmtiles://./data/protected_areas.pmtiles',
          attribution: 'Russian Ministry'
        }
      },
      layers: [
        {
          id: 'basemap',
          type: 'raster',
          source: 'basemap'
        },
        {
          id: 'protected-areas',
          type: 'fill',
          source: 'protected-areas',
          'source-layer': 'protected_areas',
          paint: {
            'fill-color': '#808080',
            'fill-opacity': 0.2
          }
        },
        {
          id: 'protected-areas-outline',
          type: 'line',
          source: 'protected-areas',
          'source-layer': 'protected_areas',
          paint: {
            'line-color': '#606060',
            'line-width': 1,
            'line-opacity': 0.5
          }
        }
      ]
    },
    center: [100, 73],
    zoom: 2.5,
    pitch: 30,
    bearing: 0,
    maxZoom: 10,
    minZoom: 0
  });

  // Set globe projection after style loads
  map.on('style.load', () => {
    map.setProjection({ type: 'globe' });
  });

  map.on('load', async () => {
    document.getElementById('stats').textContent = 'Loading vessel heatmap...';

    // Load and display GeoTIFF heatmap
    try {
      const response = await fetch('./data/vessel_heatmap.tif');
      const arrayBuffer = await response.arrayBuffer();
      const georaster = await parseGeoraster(arrayBuffer);

      const layer = new GeoRasterLayer({
        georaster: georaster,
        opacity: 0.8,
        resolution: 256
      });

      layer.addTo(map);

      document.getElementById('stats').textContent =
        'Vessel activity heatmap (2024)\nDarker = more activity';
    } catch (error) {
      console.error('Error loading heatmap:', error);
      document.getElementById('stats').textContent = 'Error loading heatmap';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin>
  <link rel="dns-prefetch" href="https://tiles.maps.eox.at">
  <style>
    #map{opacity:0;transition:opacity 0.8s ease-out}
    #map.ready{opacity:1}
  </style>
</head>
<body>
<div id="map"></div>
<div id="about-modal">
  <div id="about-content">
    <h2 id="about-title"></h2>
    <p id="about-description"></p>
  </div>
</div>
<div id="tooltip"></div>
<div id="controls">
  <select id="category-select">
    <option value="all">vessel types</option>
  </select>
  <select id="places-select" class="hidden">
    <option value="">places of interest</option>
  </select>
  <div id="places-info" class="hidden"></div>
</div>
<button id="lang-toggle">en</button>
<div id="legend">
  <div id="legend-section-vessel" class="legend-section-title"></div>
  <div id="legend-years"></div>
  <div class="legend-item legend-multi-year">
    <div class="legend-symbol">
      <div class="legend-square" style="background: rgb(180, 180, 180);"></div>
    </div>
    <span id="legend-multi-year" class="legend-text"></span>
  </div>
  <div id="legend-section-layers" class="legend-section-title"></div>
  <div id="legend-layers"></div>
  <div id="legend-source" class="legend-source"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_NAME: albedo
  GCP_PROJECT: data-desk-web
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="gcr.io/${{ env.GCP_PROJECT }}/${{ env.PROJECT_NAME }}"
          BUILD_ID=$(gcloud builds submit --tag $IMAGE --format="value(id)")
          echo "Build ID: $BUILD_ID"

          # Poll for build completion
          while true; do
            STATUS=$(gcloud builds describe $BUILD_ID --format="value(status)")
            echo "Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Build completed successfully"
              break
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy to Cloud Run
        run: |
          IMAGE="gcr.io/${{ env.GCP_PROJECT }}/${{ env.PROJECT_NAME }}"
          gcloud run deploy ${{ env.PROJECT_NAME }} \
            --image $IMAGE \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --allow-unauthenticated \
            --quiet

      - name: Get service URL
        run: |
          echo "🚀 Deployment complete!"
          SERVICE_URL=$(gcloud run services describe ${{ env.PROJECT_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT }} \
            --format 'value(status.url)')
          echo "🌐 Service URL: $SERVICE_URL"

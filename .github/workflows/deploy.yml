name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_NAME: albedo
  GCP_PROJECT: data-desk-web
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          IMAGE="gcr.io/${{ env.GCP_PROJECT }}/${{ env.PROJECT_NAME }}"

          # Build
          BUILD=$(gcloud builds submit --tag $IMAGE --async --format="value(id)")
          until STATUS=$(gcloud builds describe $BUILD --format='value(status)' 2>/dev/null); \
                [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "FAILURE" ]; do sleep 10; done
          [ "$STATUS" = "SUCCESS" ] || exit 1

          # Deploy
          gcloud run deploy ${{ env.PROJECT_NAME }} \
            --image $IMAGE \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --quiet
